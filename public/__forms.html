<html>
  <head></head>
  <body>
    <!--
      Netlify Forms (OpenNext/Next.js):
      This file exists solely for deploy-time form detection. It is not shown to users.
      See: https://opennext.js.org/netlify/forms
    -->
    <form name="contact" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" type="text" />
      <input name="email" type="text" />
      <input name="subject" type="text" />
      <input name="subjectDisplay" type="text" />
      <input name="emailSubject" type="text" />
      <input name="message" type="text" />
      <input name="website" type="text" />
    </form>
  </body>
</html>
